        - "center": [0.0, -0.0685, 0.0897]
          "radius": 0.02
        - "center": [0.0, -0.0715, 0.1785]
          "radius": 0.02
        - "center": [0.0, -0.0745, 0.2674]
          "radius": 0.02
        - "center": [0.0, -0.0774, 0.3563]
          "radius": 0.02
        - "center": [-0.0, -0.0778, 0.4449]
          "radius": 0.02
