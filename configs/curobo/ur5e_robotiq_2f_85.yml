##
## cuRobo robot config for UR5e + Robotiq 2F-85.
##
## Based on the 2F-140 config with updated paths, joint names, and
## grasp_frame offset (0.14m vs 0.20m for 2F-140).
##

robot_cfg:
  kinematics:
    urdf_path: "data/robots/ur5e_robotiq_2f_85/ur5e_robotiq_2f_85.urdf"
    asset_root_path: "data/robots/ur5e_robotiq_2f_85"

    base_link: "base_link"
    ee_link: "grasp_frame"
    link_names: null
    lock_joints:
      left_outer_knuckle_joint: 0.0
      left_inner_knuckle_joint: 0.0
      left_inner_finger_joint: 0.0
      right_outer_knuckle_joint: 0.0
      right_inner_knuckle_joint: 0.0
      right_inner_finger_joint: 0.0

    collision_link_names:
      - shoulder_link
      - upper_arm_link
      - forearm_link
      - wrist_1_link
      - wrist_2_link
      - wrist_3_link
      - tool0
      - robotiq_arg2f_base_link
      - left_outer_knuckle
      - left_inner_knuckle
      - left_outer_finger
      - left_inner_finger
      - left_inner_finger_pad
      - right_outer_knuckle
      - right_inner_knuckle
      - right_outer_finger
      - right_inner_finger
      - right_inner_finger_pad

    # Collision spheres fitted from URDF collision meshes (tight fit)
    collision_spheres:
      shoulder_link:
        - "center": [0.0, 0.0, 0.0]
          "radius": 0.0299
        - "center": [-0.041, -0.041, -0.0591]
          "radius": 0.02
        - "center": [-0.0419, -0.0424, 0.0006]
          "radius": 0.02
