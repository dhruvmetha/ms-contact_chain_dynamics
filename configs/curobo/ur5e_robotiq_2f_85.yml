          "radius": 0.0445
        - "center": [0.0, 0.0, 0.178]
          "radius": 0.0445
        - "center": [0.0, 0.0, 0.2669]
          "radius": 0.0445
        - "center": [0.0, 0.0, 0.3559]
          "radius": 0.0445
        - "center": [-0.0, -0.0636, -0.0585]
          "radius": 0.02
        - "center": [0.0, -0.0656, 0.0008]
