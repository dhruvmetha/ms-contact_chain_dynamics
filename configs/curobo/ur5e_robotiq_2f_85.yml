        - "center": [-0.0581, -0.0, -0.0598]
          "radius": 0.02
        - "center": [-0.0593, -0.0, 0.0]
          "radius": 0.02
        - "center": [-0.0559, 0.0006, 0.0578]
          "radius": 0.02
        - "center": [-0.0473, 0.0526, -0.0501]
          "radius": 0.02
      upper_arm_link:
        - "center": [0.0, 0.0, 0.0]
          "radius": 0.0445
