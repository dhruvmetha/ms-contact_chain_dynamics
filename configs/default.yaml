defaults:
  - _self_
  - task: default
  - solver: random

seed: 42

runtime:
  control_mode: pd_ee_delta_pose
  obs_mode: state
  reward_mode: none
  num_envs: 16
  max_episode_steps: 100
  record_video: false
  video_dir: videos
  render_mode: rgb_array

logging:
  use_wandb: false
  project: taskbench
  group: default

run:
  solver: random
  mode: null      # null = auto-infer from solver name / batched flag
  batched: false
  num_episodes: 100
